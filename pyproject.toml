[project]
name = "sales-call-qa"
version = "0.1.0"
description = "Automated compliance QA for sales calls: Claude checks each call against a rubric and quotes the evidence"
readme = "README.md"
authors = [
    { name = "Piers", email = "piersthompson90@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
generate-calls = "sales_call_qa.generate_calls:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
]
